name: CI

on:
  workflow_call:
    secrets:
      CI_DATABASE_URL:
        required: true
      CI_JWT_SECRET:
        required: true
      CI_JWT_EXPIRES_IN:
        required: true
      CI_EMAIL_USER:
        required: true
      CI_BREVO_API_KEY:
        required: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --config prisma7.config.ts

      - name: Lint
        run: npm run lint:check

      - name: Test coverage
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.CI_JWT_EXPIRES_IN }}
          EMAIL_USER: ${{ secrets.CI_EMAIL_USER }}
          BREVO_API_KEY: ${{ secrets.CI_BREVO_API_KEY }}
        run: >-
          npm run test:cov --
          --coverageThreshold='{"global":{"branches":90,"functions":90,"lines":90,"statements":90}}'

      - name: Build application
        run: npm run build

      - name: Build Docker image
        run: docker build --tag expense-tracker-backend:ci .

      - name: Smoke test Docker image
        run: |
          docker run --detach --name backend-ci-smoke \
            --publish 127.0.0.1:3000:3000 \
            --env DATABASE_URL=postgresql://ci:ci@localhost:5432/ci \
            --env JWT_SECRET=ci-smoke-secret \
            --env BREVO_API_KEY=ci-smoke-key \
            expense-tracker-backend:ci
          trap 'docker rm -f backend-ci-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ | grep -Fq 'Hello World!'; then
              exit 0
            fi
            sleep 1
          done
          docker logs backend-ci-smoke
          exit 1

