name: Backend Smoke Tests

on:
  workflow_call:
    secrets:
      CI_DATABASE_URL:
        required: true
      CI_JWT_SECRET:
        required: true
      CI_JWT_EXPIRES_IN:
        required: true
      CI_EMAIL_USER:
        required: true
      CI_BREVO_API_KEY:
        required: true

env:
  NODE_VERSION: '24'

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PORT: 3000
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      JWT_EXPIRES_IN: ${{ secrets.CI_JWT_EXPIRES_IN }}
      EMAIL_USER: ${{ secrets.CI_EMAIL_USER }}
      BREVO_API_KEY: ${{ secrets.CI_BREVO_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --config prisma7.config.ts

      - name: Build
        run: npm run build

      - name: Start API
        run: |
          npm run start:prod > smoke-test.log 2>&1 &
          echo $! > smoke-test.pid

      - name: Wait for API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:${PORT}/ > smoke-response.txt; then
              exit 0
            fi

            sleep 2
          done

          cat smoke-test.log
          exit 1

      - name: Verify Root Endpoint
        run: |
          test "$(cat smoke-response.txt)" = "Hello World!"

      - name: Stop API
        if: always()
        run: |
          if [ -f smoke-test.pid ]; then
            kill "$(cat smoke-test.pid)" || true
          fi
