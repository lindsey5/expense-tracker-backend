name: Backend Pipeline

on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  security:
    name: Security
    uses: ./.github/workflows/security.yml
    secrets: inherit

  publish:
    name: CI / Publish image
    needs: [ci, security]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.ci.result == 'success' &&
      needs.security.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-app:${{ github.sha }}

  cd:
    name: CD
    needs: [publish]
    if: needs.publish.result == 'success'
    uses: ./.github/workflows/cd.yml
    secrets: inherit

  notify:
    needs: [ci, security, publish, cd]
    if: always()
    uses: ./.github/workflows/notify.yml
    with:
      pipeline_name: Backend CI/CD
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
      source_branch: ${{ github.head_ref || github.ref_name }}
      source_actor: ${{ github.actor }}
      source_sha: ${{ github.sha }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
