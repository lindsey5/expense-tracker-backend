name: Backend CI/CD

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - main

  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  security:
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/security.yml

  lint:
    uses: ./.github/workflows/lint.yml

  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
    secrets: inherit

  e2e-tests:
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit

  smoke-tests:
    uses: ./.github/workflows/smoke-tests.yml
    secrets: inherit

  build:
    needs:
      - security
      - lint
      - unit-tests
      - e2e-tests
      - smoke-tests

    if: >
      always() &&
      needs.lint.result == 'success' &&
      needs.unit-tests.result == 'success' &&
      needs.smoke-tests.result == 'success' &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped')

    uses: ./.github/workflows/build.yml

  publish:
    needs:
      - build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success'

    uses: ./.github/workflows/publish.yml
    with:
      image: ${{ needs.build.outputs.image }}
    secrets: inherit

  notify:
    needs:
      - security
      - lint
      - unit-tests
      - e2e-tests
      - smoke-tests
      - build
      - publish

    if: always()

    uses: ./.github/workflows/notify.yml

    with:
      pipeline_name: Backend CI/CD
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}

    secrets: inherit
