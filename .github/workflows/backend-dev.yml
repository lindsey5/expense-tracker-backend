name: Backend Dev CI

on:
  pull_request:
    branches:
      - dev

  push:
    branches:
      - dev

  workflow_dispatch:

concurrency:
  group: backend-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  verify:
    name: Backend Dev - Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      JWT_EXPIRES_IN: ${{ secrets.CI_JWT_EXPIRES_IN }}
      EMAIL_USER: ${{ secrets.CI_EMAIL_USER }}
      BREVO_API_KEY: ${{ secrets.CI_BREVO_API_KEY }}

    steps:
      - name: Setup - Checkout
        uses: actions/checkout@v4

      - name: Setup - Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup - Install Dependencies
        run: npm ci

      - name: Setup - Generate Prisma Client
        run: npx prisma generate --config prisma7.config.ts

      - name: Verify - Lint
        run: npm run lint:check

      - name: Verify - Unit Tests
        run: >
          npm run test:cov --
          --coverageThreshold='{"global":{"branches":90,"functions":90,"lines":90,"statements":90}}'

      - name: Verify - Build
        run: npm run build

  notify:
    name: Backend Dev - Notify
    needs:
      - verify

    if: ${{ always() }}

    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      VERIFY_RESULT: ${{ needs.verify.result }}

    steps:
      - name: Notify - Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}

        run: |
          if [ "$VERIFY_RESULT" = "success" ]; then
            ICON="✅"
            STATUS="SUCCESS"
          elif [ "$VERIFY_RESULT" = "cancelled" ]; then
            ICON="⚠️"
            STATUS="CANCELLED"
          else
            ICON="❌"
            STATUS="FAILED"
          fi

          MESSAGE="$ICON Backend Dev CI: $STATUS

          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Actor: ${{ github.actor }}

          Verification: $VERIFY_RESULT

          Commit: ${{ github.sha }}

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"