name: Notify Telegram

on:
  workflow_call:
    inputs:
      pipeline_name:
        required: true
        type: string

      status:
        required: true
        type: string
      source_branch:
        required: true
        type: string
      source_actor:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      run_url:
        required: true
        type: string

    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false

      TELEGRAM_CHAT_ID:
        required: false

jobs:
  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PIPELINE_STATUS: ${{ inputs.status }}
      PIPELINE_NAME: ${{ inputs.pipeline_name }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      SOURCE_ACTOR: ${{ inputs.source_actor }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RUN_URL: ${{ inputs.run_url }}

    steps:
      - name: Send Telegram Notification
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: |
          if [ "$PIPELINE_STATUS" = "success" ]; then
            ICON="✅"
            STATUS="SUCCESS"
          elif [ "$PIPELINE_STATUS" = "cancelled" ]; then
            ICON="⚠️"
            STATUS="CANCELLED"
          else
            ICON="❌"
            STATUS="FAILED"
          fi

          MESSAGE="$ICON $PIPELINE_NAME: $STATUS

          Repository: $GITHUB_REPOSITORY
          Branch: $SOURCE_BRANCH
          Actor: $SOURCE_ACTOR

          Commit: $SOURCE_SHA

          Run: $RUN_URL"

          curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
