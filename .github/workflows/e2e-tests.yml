name: Backend E2E Tests

on:
  workflow_call:
    secrets:
      CI_DATABASE_URL:
        required: true
      CI_JWT_SECRET:
        required: true
      CI_JWT_EXPIRES_IN:
        required: true
      CI_EMAIL_USER:
        required: true
      CI_BREVO_API_KEY:
        required: true

env:
  NODE_VERSION: '24'

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      JWT_EXPIRES_IN: ${{ secrets.CI_JWT_EXPIRES_IN }}
      EMAIL_USER: ${{ secrets.CI_EMAIL_USER }}
      BREVO_API_KEY: ${{ secrets.CI_BREVO_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --config prisma7.config.ts

      - name: E2E Tests
        run: npm run test:e2e -- modules