name: Backend Publish

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string

    secrets:
      PRODUCTION_DEPLOY_WEBHOOK_URL:
        required: false

permissions:
  contents: read

env:
  DEPLOY_WEBHOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK_URL }}

jobs:
  publish:
    name: Deploy Image
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Dev And Main SHA Match
        run: |
          git fetch --no-tags origin \
            +refs/heads/dev:refs/remotes/origin/dev \
            +refs/heads/main:refs/remotes/origin/main

          DEV_SHA="$(git rev-parse refs/remotes/origin/dev)"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"

          echo "dev:  ${DEV_SHA}"
          echo "main: ${MAIN_SHA}"

          if [ "$DEV_SHA" != "$MAIN_SHA" ]; then
            echo "::error::dev and main must point to the same commit before publishing."
            exit 1
          fi

      - name: Trigger Deployment
        if: ${{ env.DEPLOY_WEBHOOK_URL != '' }}
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"image\":\"${{ inputs.image }}\",\"sha\":\"${{ github.sha }}\"}" \
            "$DEPLOY_WEBHOOK_URL"
